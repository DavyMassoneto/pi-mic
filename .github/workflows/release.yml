name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci && npm run check
      - id: version
        run: echo "next=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.next != ''
        run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version
      - if: steps.version.outputs.next != ''
        run: npm publish --access public
      - if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: v${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --title "$NEXT"
      - env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git reset --hard -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin dev
          git checkout -q -B dev origin/dev
          git merge --no-ff origin/main -m "Merge branch 'main' into dev"
          git push origin dev
          if [ -n "$NEXT" ]; then git push origin --delete "release/$NEXT" || true; fi
