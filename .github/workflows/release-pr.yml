name: release-pr

# Git-flow automático: a cada push em dev, calcula a próxima versão pelos commits convencionais
# desde a última tag e mantém aberta a PR release/<versão> → main. Ninguém escolhe a versão.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run check
      - id: version
        run: echo "next=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.next == ''
        run: echo "Nenhum feat/fix/perf/breaking desde a última tag; sem release."
      - if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          branch="release/$NEXT"
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          notes=$(git log --no-merges --format='- %s' $range | grep -E '^- (feat|fix|perf)(\(|!|:)' || true)
          # PRs de release de versões anteriores que ficaram para trás são substituídas.
          gh pr list --base main --state open --json number,headRefName \
            -q ".[] | select(.headRefName | startswith(\"release/\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Substituída por $branch."; done
          git push --force origin "HEAD:refs/heads/$branch"
          body=$(printf 'Release automática %s (versão calculada pelos commits desde %s).\n\n%s\n' "$NEXT" "${last:-o início}" "$notes")
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "chore(release): $NEXT" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "chore(release): $NEXT" --body "$body"
          fi
